[package]
name = "mixhub-studio"
version = "0.1.0"
description = "Distilled AI Model Router & Developer Workspace"
authors = ["MixHub Studio Team"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mixhub_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
tower-http = { version = "0.5", features = ["cors"] }
reqwest = { version = "0.11", features = ["json", "stream", "multipart"] }
rusqlite = { version = "0.29", features = ["bundled"] }
chrono = "0.4"
futures-util = "0.3"
dotenvy = "0.15"
lazy_static = "1.4"
parking_lot = "0.12"
tokio-stream = "0.1"
tokio-util = { version = "0.7.18", features = ["io"] }
tauri-plugin-log = "2.0.0-rc"
tauri-plugin-dialog = "2"
log = "0.4.29"
uuid = { version = "1.11.0", features = ["v4"] }
pdf-extract = "0.7.2"
urlencoding = "2.1.3"

# 优化开发模式以减少磁盘空间占用
[profile.dev]
debug = 1            # 减少调试符号，极大地减少 target 空间 (默认是 2)
incremental = true   # 保持增量编译以保证速度

# 优化发布模式以压缩二进制体积并减少临时产物
[profile.release]
strip = true         # 自动从二进制中剥离调试符号
opt-level = "z"      # 专注于优化文件体积
lto = true           # 启用 Link-Time Optimization
codegen-units = 1    # 减少编译单元，精简代码体积
panic = "abort"      # 遇到 panic 直接终止，减少异常处理开销


